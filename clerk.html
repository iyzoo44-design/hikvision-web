<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>점원 AR — 행복한 빵집</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  height:100%;background:#000;color:#fff;
  font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  overflow:hidden;
}

/* ── 상단 HUD 바 ── */
#hud{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:8px 14px;
  background:rgba(0,0,0,0.75);
  border-bottom:1px solid rgba(255,60,60,0.3);
  display:flex;align-items:center;justify-content:space-between;
  backdrop-filter:blur(4px);
}
.hud-left{display:flex;align-items:center;gap:10px;}
.hud-title{font-size:13px;font-weight:700;color:#FFD9A0;letter-spacing:.5px;}
.live-badge{
  background:#B71C1C;color:#fff;font-size:10px;font-weight:700;
  padding:2px 8px;border-radius:12px;
  animation:blink 1.4s infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

.hud-right{display:flex;align-items:center;gap:8px;}
#connStatus{
  display:flex;align-items:center;gap:5px;
  font-size:11px;color:rgba(255,255,255,.55);
}
.sdot{width:7px;height:7px;border-radius:50%;background:#444;}
.sdot.green{background:#4CAF50;box-shadow:0 0 5px #4CAF50;}
.sdot.yellow{background:#FFD600;animation:blink .8s infinite;}
.sdot.red{background:#f44336;}

/* ── 카메라 영역 ── */
#camArea{
  position:fixed;
  top:40px;
  left:0;
  right:0;
  width:100%;
  aspect-ratio:4/3;
  overflow:hidden;
  background:#0a0500;
}
#camIframe{
  width:100%;height:100%;border:none;
  display:none;
}
#camPlaceholder{
  width:100%;height:100%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:8px;color:rgba(255,255,255,.2);
}
.cam-ico{font-size:48px;opacity:.3;}
.cam-msg{font-size:13px;}

/* ── AR 오버레이 (포인터) ── */
#arOverlay{
  position:fixed;inset:0;
  pointer-events:none;
  z-index:50;
}

/* 전체 십자선 */
#crossH,#crossV{
  position:absolute;
  background:rgba(255,40,40,0.25);
  display:none;
  transition:all .15s ease;
}
#crossH{height:1px;width:100%;left:0;}
#crossV{width:1px;height:100%;top:0;}

/* 포인터 원 */
#pointer{
  position:absolute;
  width:64px;height:64px;
  border-radius:50%;
  border:3px solid #ff2020;
  background:rgba(255,30,30,0.12);
  transform:translate(-50%,-50%);
  display:none;
  box-shadow:0 0 24px rgba(255,0,0,0.5), inset 0 0 12px rgba(255,0,0,0.1);
}
#pointer::before{
  content:'';position:absolute;
  top:50%;left:50%;width:10px;height:10px;
  background:#ff2020;border-radius:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 8px #ff2020;
}
#pointer.show{display:block;animation:pointerPop .4s ease-out;}
@keyframes pointerPop{
  0%{transform:translate(-50%,-50%) scale(.15);opacity:0}
  65%{transform:translate(-50%,-50%) scale(1.2);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1);opacity:1}
}

/* 포인터 라벨 */
#pointerLabel{
  position:absolute;
  background:rgba(200,0,0,0.88);
  color:#fff;font-size:12px;font-weight:700;
  padding:4px 10px;border-radius:5px;
  transform:translate(-50%, 38px);
  display:none;white-space:nowrap;
}
#pointerLabel::before{
  content:'';position:absolute;
  top:-5px;left:50%;transform:translateX(-50%);
  border:5px solid transparent;
  border-bottom-color:rgba(200,0,0,0.88);
  border-top:none;
}

/* AR 코너 마커 */
.ar-corner{
  position:fixed;width:22px;height:22px;
  border-color:rgba(255,50,50,0.4);border-style:solid;
}
.ar-corner.tl{top:48px;left:8px;border-width:2px 0 0 2px;border-radius:2px 0 0 0;}
.ar-corner.tr{top:48px;right:8px;border-width:2px 2px 0 0;border-radius:0 2px 0 0;}
.ar-corner.bl{bottom:90px;left:8px;border-width:0 0 2px 2px;border-radius:0 0 0 2px;}
.ar-corner.br{bottom:90px;right:8px;border-width:0 2px 2px 0;border-radius:0 0 2px 0;}

/* ── 하단 정보 패널 ── */
/* 슬라이드형 주문 패널 (평소엔 숨김, 고객 선택 시 또는 수동으로 열림) */
#orderPanel{
  position:fixed;left:0;right:0;bottom:0;z-index:150;
  background:rgba(10,5,0,0.97);
  border-top:1px solid rgba(184,134,11,0.4);
  padding:10px 10px 14px;
  max-height:62vh;overflow-y:auto;
  transform:translateY(100%);
  transition:transform .28s ease;
  box-shadow:0 -4px 20px rgba(0,0,0,.5);
}
#orderPanel.open{ transform:translateY(0); }
#orderHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
#orderHead .oh-title{font-size:.78rem;font-weight:700;color:#FFD9A0;}
#orderCloseBtn{border:none;background:rgba(255,255,255,.1);color:#fff;border-radius:8px;width:28px;height:28px;font-size:.9rem;cursor:pointer;}
#paidInfo{
  display:none;background:rgba(27,94,32,.22);border:1px solid rgba(76,175,80,.5);
  border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:.68rem;color:#C8F0CC;line-height:1.7;
}
#paidInfo b{color:#8FE39A;}
#orderTotal{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:8px;padding:6px 10px;
  background:rgba(184,134,11,0.15);border-radius:8px;
}
#orderTotalAmt{
  font-size:1.1rem;font-weight:700;color:#FFD9A0;font-family:monospace;
}
#pickedList{margin-bottom:8px;}
.picked-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 9px;background:rgba(255,255,255,.06);border-radius:7px;margin-bottom:4px;
}
.picked-row .pr-name{font-size:.7rem;color:#FFD9A0;}
.picked-row .pr-btns{display:flex;gap:5px;}
.picked-row button{
  width:24px;height:24px;border:none;border-radius:6px;cursor:pointer;
  font-size:.85rem;font-weight:700;color:#fff;
}
.picked-row .pr-minus{background:rgba(123,28,28,.75);}
.picked-row .pr-plus{background:rgba(27,94,32,.85);}
.order-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:6px;
}
.order-btn{
  padding:7px 2px;border:none;border-radius:8px;
  background:rgba(255,255,255,0.08);color:rgba(255,190,80,0.9);
  font-family:'Noto Sans KR',sans-serif;font-size:0.62rem;font-weight:700;
  cursor:pointer;text-align:center;line-height:1.4;
  transition:all .15s;-webkit-user-select:none;user-select:none;
}
.order-btn.picked{background:rgba(184,134,11,0.5);outline:2px solid #FFD9A0;}
.order-btn:active{background:rgba(184,134,11,0.6);transform:scale(0.94);}
.order-btn .ob-em{font-size:1.1rem;display:block;margin-bottom:2px;}
.order-btn .ob-price{font-size:0.55rem;color:rgba(255,190,80,0.5);}
.order-row{display:flex;gap:5px;}
#orderClearBtn{
  flex:1;padding:7px;border:none;border-radius:8px;
  background:rgba(123,28,28,0.7);color:#fff;
  font-family:'Noto Sans KR',sans-serif;font-size:0.68rem;font-weight:700;cursor:pointer;
}
#orderConfirmBtn{
  flex:2;padding:7px;border:none;border-radius:8px;
  background:rgba(27,94,32,0.9);color:#fff;
  font-family:'Noto Sans KR',sans-serif;font-size:0.72rem;font-weight:700;cursor:pointer;
}
/* 항상 떠있는 열기 버튼 */
#orderToggleBtn{
  position:fixed;right:10px;bottom:16px;z-index:151;
  padding:10px 16px;border:none;border-radius:22px;
  background:rgba(184,134,11,.92);color:#fff;
  font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:.72rem;cursor:pointer;
  box-shadow:0 2px 12px rgba(0,0,0,.45);
}
#orderToggleBtn .ob-badge{
  display:inline-block;margin-left:5px;background:#B71C1C;color:#fff;
  border-radius:10px;padding:1px 7px;font-size:.64rem;
}

#infoPanel{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(0,0,0,0.82);
  border-top:1px solid rgba(255,255,255,.08);
  padding:8px 14px 10px;
  backdrop-filter:blur(4px);
}
.info-row{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.info-key{font-size:10px;color:rgba(255,255,255,.4);min-width:64px;}
.info-val{font-size:12px;color:#fff;font-weight:500;font-family:monospace;}
.info-val.active{color:#ff6060;}

/* ── 통화 버튼 ── */
#callPanel{
  position:fixed;bottom:76px;left:50%;transform:translateX(-50%);
  z-index:101;display:flex;gap:8px;align-items:center;
}
#callBtn{
  padding:9px 22px;border:none;border-radius:20px;
  font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;
  background:#1B5E20;color:#fff;
  box-shadow:0 2px 12px rgba(0,0,0,.4);
  transition:all .2s;
}
#callBtn.ringing{background:#F57F17;animation:blink .7s infinite;}
#callBtn.active{background:#B71C1C;}
#callBtn:active{transform:scale(.95);}
#micStatus{
  font-size:11px;color:rgba(255,255,255,.4);
  background:rgba(0,0,0,.5);padding:5px 10px;border-radius:12px;
}
/* 음성 시각화 */
#vviz{
  display:none;align-items:flex-end;gap:2px;height:20px;
  margin-left:4px;
}
#vviz.on{display:flex;}
.vb{width:3px;background:rgba(255,190,80,.75);border-radius:2px;
    animation:vw .55s ease-in-out infinite alternate;}
.vb:nth-child(1){animation-delay:0s}
.vb:nth-child(2){animation-delay:.1s}
.vb:nth-child(3){animation-delay:.2s}
.vb:nth-child(4){animation-delay:.15s}
.vb:nth-child(5){animation-delay:.05s}
@keyframes vw{from{height:4px}to{height:18px}}

/* 고객 메시지 알림 */
#msgAlert{
  position:fixed;top:52px;left:50%;transform:translateX(-50%);
  background:rgba(184,134,11,0.92);
  color:#fff;font-size:13px;font-weight:700;
  padding:8px 18px;border-radius:20px;
  display:none;z-index:200;
  max-width:90vw;text-align:center;
  animation:slideDown .3s ease;
}
@keyframes slideDown{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* 카메라 연결 버튼 */
#camConnBtn{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:60;padding:12px 28px;
  background:rgba(184,134,11,.9);color:#fff;
  border:none;border-radius:14px;font-size:14px;font-weight:700;
  cursor:pointer;font-family:inherit;
  box-shadow:0 4px 16px rgba(0,0,0,.4);
}
#camConnBtn:active{transform:translate(-50%,-50%) scale(.96);}

/* 점원 광학줌 슬라이드 */
.cz-reset-btn{
  width:46px;height:34px;border:none;border-radius:8px;
  background:rgba(0,0,0,.55);color:rgba(255,190,80,.95);
  font-size:.66rem;font-weight:700;cursor:pointer;
  -webkit-user-select:none;user-select:none;
}
.cz-reset-btn:active{background:rgba(184,134,11,.75);}
#czTrack{
  position:relative;width:46px;height:150px;border-radius:23px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  touch-action:none;
}
#czTrack .cz-mark{
  position:absolute;left:50%;width:18px;height:1px;
  background:rgba(255,255,255,.15);transform:translateX(-50%);
}
#czTrack .cz-lbl-top,#czTrack .cz-lbl-bottom{
  position:absolute;left:50%;transform:translateX(-50%);
  font-size:.6rem;color:rgba(255,190,80,.55);pointer-events:none;
}
#czTrack .cz-lbl-top{top:6px;}
#czTrack .cz-lbl-bottom{bottom:6px;}
#czKnob{
  position:absolute;left:50%;top:50%;width:40px;height:40px;border-radius:50%;
  background:rgba(184,134,11,.9);border:2px solid rgba(255,210,160,.6);
  transform:translate(-50%,-50%);
}

/* 타임스탬프 */
#clock{
  position:fixed;bottom:72px;right:10px;
  font-size:10px;color:rgba(255,255,255,.25);
  font-family:monospace;z-index:60;
}

</style>

</head>
<body>

<!-- 상단 HUD -->
<div id="hud">
  <div class="hud-left">
    <div class="hud-title">🕶️ 점원 AR — 행복한 빵집</div>
    <div class="live-badge">● LIVE</div>
  </div>
  <div class="hud-right">
    <div id="vviz"><div class="vb"></div><div class="vb"></div><div class="vb"></div><div class="vb"></div><div class="vb"></div></div>
    <div id="connStatus">
      <div class="sdot yellow" id="fbDot"></div>
      <span id="fbTxt">연결 중...</span>
    </div>
  </div>
</div>

<!-- AR 코너 마커 -->
<div class="ar-corner tl"></div>
<div class="ar-corner tr"></div>
<div class="ar-corner bl"></div>
<div class="ar-corner br"></div>

<!-- 카메라 영역 -->
<div id="camArea">
  <iframe id="camIframe" src="" allowfullscreen allow="autoplay"></iframe>
  <div id="camPlaceholder">
    <div class="cam-ico">📷</div>
    <div class="cam-msg">카메라 버튼을 눌러 연결하세요</div>
  </div>
  <button id="camConnBtn" onclick="connCam()">📷 카메라 연결</button>
</div>

<!-- AR 오버레이 -->
<div id="arOverlay">
  <div id="crossH"></div>
  <div id="crossV"></div>
  <div id="pointer"></div>
  <div id="pointerLabel">👆 고객 지정 상품</div>
</div>

<!-- 고객 메시지 알림 -->
<div id="msgAlert"></div>
<div id="clerkZoomCtrl" style="position:fixed;top:50px;right:10px;z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;">
  <span style="font-size:.62rem;color:rgba(255,190,80,.7);">🔍 광학줌</span>
  <div id="czTrack">
    <span class="cz-lbl-top">＋</span>
    <div class="cz-mark" style="top:50%;"></div>
    <span class="cz-lbl-bottom">－</span>
    <div id="czKnob"></div>
  </div>
  <button class="cz-reset-btn" onclick="zoomResetApprox()">1x</button>
</div>

<!-- 통화 패널 -->
<div id="callPanel">
  <button id="callBtn" onclick="toggleCall()">📞 통화 대기 중</button>
  <div id="micStatus">마이크 꺼짐</div>
</div>
<button id="nextCustBtn" onclick="forceNextCustomer()" style="position:fixed;top:50px;left:10px;z-index:200;padding:8px 12px;border:none;border-radius:14px;background:rgba(184,134,11,.9);color:#fff;font-family:'Noto Sans KR',sans-serif;font-size:.66rem;font-weight:700;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.4);text-align:center;line-height:1.5;">🙋 다음 고객으로<br>넘기기</button>
<div id="camOrderBadge" style="position:fixed;top:110px;left:10px;z-index:200;color:#FFD9A0;font-size:.68rem;font-weight:700;line-height:1.55;display:none;max-width:60%;text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 6px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,1);"></div>

<div id="clock"></div>

<!-- 하단 정보 -->
<div id="infoPanel">
  <div class="info-row">
    <span class="info-key">포인터</span>
    <span class="info-val" id="coordVal">수신 대기 중...</span>
  </div>
  <div class="info-row">
    <span class="info-key">마지막 터치</span>
    <span class="info-val" id="lastTouch">—</span>
  </div>
</div>

<!-- 슬라이드형 주문 패널 -->
<button id="orderToggleBtn" onclick="toggleOrderPanel()">🧾 주문<span class="ob-badge" id="orderBadge" style="display:none;">0</span></button>
<div id="orderPanel">
  <div id="orderHead">
    <span class="oh-title">🧾 주문 담기</span>
    <button id="orderCloseBtn" onclick="toggleOrderPanel(false)">✕</button>
  </div>
  <div id="paidInfo"></div>
  <div id="orderTotal">
    <span style="font-size:.65rem;color:rgba(255,190,80,.5);">현재 합계 (배달비 별도)</span>
    <span id="orderTotalAmt">₩0</span>
    <span id="orderItemCount" style="font-size:.6rem;color:rgba(255,190,80,.4);">0개</span>
  </div>
  <div id="pickedList"></div>
  <div class="order-grid" id="orderGrid"></div>
  <div class="order-row">
    <button id="orderClearBtn" onclick="clearOrder()">🗑 전체 취소</button>
    <button id="orderConfirmBtn" onclick="confirmOrder()">✅ 결제 요청 전송</button>
  </div>
</div>

<!-- 원격 오디오 -->
<audio id="remoteAudio" autoplay playsinline></audio>

<script>
// ═══════════════════════════════════════════
// Firebase 설정
// ═══════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyC7GngQFP1JhnqIb8h_FcFEWAza1nvPFg0",
  authDomain: "dongne-bakery.firebaseapp.com",
  databaseURL: "https://dongne-bakery-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "dongne-bakery",
  storageBucket: "dongne-bakery.firebasestorage.app",
  messagingSenderId: "835419452184",
  appId: "1:835419452184:web:e710137926fc24ffd8646d"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const WHEP_URL = 'https://whep.priceline.co.kr';
const ROOM_ID  = 'bakery-room-001';

// ── Firebase 연결 상태 ──
db.ref('.info/connected').on('value', snap=>{
  const ok = snap.val();
  document.getElementById('fbDot').className = 'sdot '+(ok?'green':'red');
  document.getElementById('fbTxt').textContent = ok?'Firebase 연결됨':'연결 끊김';
});

// ═══════════════════════════════════════════
// 카메라 연결
// ═══════════════════════════════════════════
let camPc=null, camRetryTimer=null, camConnected=false;

async function connCam(){
  const btn=document.getElementById('camConnBtn');
  btn.style.display='none';
  document.getElementById('camPlaceholder').style.display='none';
  await startCamWHEP();
}
  async function startCamWHEP(){
  if(camPc){camPc.close();camPc=null;}
  const video=document.createElement('video');
  video.autoplay=true;
  video.playsinline=true;
  video.muted=true;
  video.style.cssText='width:100%;height:100%;object-fit:cover;display:block;';
  video.id='clerkVideo';

  const stage=document.createElement('div');
  stage.id='clerkZoomStage';
  stage.style.cssText='position:absolute;inset:0;width:100%;height:100%;transform-origin:center center;transition:transform .1s ease-out;';
  stage.appendChild(video);

  const camArea=document.getElementById('camArea');
  camArea.innerHTML='';
  camArea.appendChild(stage);
  applyClerkZoom(lastCustomerZoom, lastCustomerPanX, lastCustomerPanY);
  
  const pc2=new RTCPeerConnection({
    iceServers:[
      {urls:'stun:stun.l.google.com:19302'},
      {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
      {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'}
    ]
  });
  camPc=pc2;

  pc2.ontrack=function(e){
    if(e.track.kind==='video'){
      video.srcObject=e.streams[0];
      video.onloadedmetadata=function(){
        video.play().catch(()=>{});
        camConnected=true;
      };
    }
  };

  pc2.oniceconnectionstatechange=function(){
    if(pc2.iceConnectionState==='failed'||pc2.iceConnectionState==='disconnected'){
      camConnected=false;
      camRetryTimer=setTimeout(startCamWHEP,3000);
    }
  };

  pc2.addTransceiver('video',{direction:'recvonly'});
  pc2.addTransceiver('audio',{direction:'recvonly'});

  const offer=await pc2.createOffer();
  await pc2.setLocalDescription(offer);

  await new Promise(resolve=>{
    if(pc2.iceGatheringState==='complete'){resolve();return;}
    pc2.onicegatheringstatechange=()=>{if(pc2.iceGatheringState==='complete')resolve();};
    setTimeout(resolve,1200);
  });

  const resp=await fetch(WHEP_URL+'/bakery/whep',{
    method:'POST',
    headers:{'Content-Type':'application/sdp'},
    body:pc2.localDescription.sdp
  });
  if(!resp.ok) throw new Error('WHEP 오류: '+resp.status);
  const answerSdp=await resp.text();
  await pc2.setRemoteDescription({type:'answer',sdp:answerSdp});
}

let pointerFadeT = null;

// ── 고객 디지털 줌·화면이동 동기화 ──
let lastCustomerZoom=1, lastCustomerPanX=0, lastCustomerPanY=0;
function applyClerkZoom(z, px, py){
  lastCustomerZoom = z||1;
  lastCustomerPanX = typeof px==='number' ? px : 0;
  lastCustomerPanY = typeof py==='number' ? py : 0;
  const stage=document.getElementById('clerkZoomStage');
  if(!stage) return;
  const camArea=document.getElementById('camArea');
  const w=camArea.offsetWidth, h=camArea.offsetHeight;
  stage.style.transform=`translate(${lastCustomerPanX*w}px, ${lastCustomerPanY*h}px) scale(${lastCustomerZoom})`;
}
db.ref('customerZoom').on('value', snap=>{
  const d=snap.val();
  if(d && typeof d.zoom==='number') applyClerkZoom(d.zoom, d.panX, d.panY);
});
// ── 활성 고객이 바뀌면(새 손님 시작) 이전 줌/이동/주문 내역이 남아있지 않도록 즉시 리셋 ──
// 실제 손님 교체는 "A 퇴장(빈 상태) → 잠시 후 B 입장" 두 단계를 거치므로,
// 중간의 빈 상태는 무시하고 "마지막으로 확인한 손님"과 다를 때만 비교한다.
let lastKnownCustomerId = undefined; // undefined = 아직 아무도 관찰 안 함(점원 첫 접속)
db.ref('activeSession').on('value', snap=>{
  const d=snap.val();

    applyClerkZoom(1,0,0); // 새 손님이 자기 값을 보내오기 전까지는 기본값으로 초기화
    if(typeof clearOrder==='function') clearOrder(); // 이전 손님이 담았던 상품은 자동으로 비움

db.ref('pointer').on('value', snap=>{

function showPointer(rx, ry, ts){
  const camArea=document.getElementById('camArea');
  const rect=camArea.getBoundingClientRect();
  const px=rect.left+rx*rect.width;
  const py=rect.top+ry*rect.height;

  const ptr   = document.getElementById('pointer');
  const lbl   = document.getElementById('pointerLabel');
  const crossH = document.getElementById('crossH');
  const crossV = document.getElementById('crossV');

  // 포인터 원
  ptr.style.left = px+'px';
  ptr.style.top  = py+'px';
  ptr.className  = 'show';

  // 라벨
  lbl.style.left = px+'px';
  lbl.style.top  = py+'px';
  lbl.style.display = 'block';

  // 십자선
  crossH.style.top  = py+'px'; crossH.style.display='block';
  crossV.style.left = px+'px'; crossV.style.display='block';

  // 좌표 표시
  const xp = Math.round(rx*100);
  const yp = Math.round(ry*100);
  const cv = document.getElementById('coordVal');
  cv.textContent = `X: ${xp}%  Y: ${yp}%`;
  cv.className = 'info-val active';

  // 시간
  const d = ts ? new Date(ts) : new Date();
  document.getElementById('lastTouch').textContent =
    d.getHours().toString().padStart(2,'0')+':'+
    d.getMinutes().toString().padStart(2,'0')+':'+
    d.getSeconds().toString().padStart(2,'0');

  // 5초 후 사라짐
  if(pointerFadeT) clearTimeout(pointerFadeT);
  pointerFadeT = setTimeout(()=>{
    ptr.className = '';
    lbl.style.display = 'none';
    crossH.style.display = 'none';
    crossV.style.display = 'none';
    cv.textContent = '수신 대기 중...';
    cv.className = 'info-val';
  }, 5000);
}

// WebRTC 통화 (점원 측 = Answer)
// ═══════════════════════════════════════════
let pc = null, localStream = null, callActive = false;

// ── 벨소리 + 진동 (안드로이드는 진동 지원, iOS는 소리만 재생됨) ──
let ringSoundTimer = null;
function playRingBeep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.4);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+0.45);
  }catch(e){}
}
function startRinging(){
  stopRinging();
  playRingBeep();
  ringSoundTimer = setInterval(playRingBeep, 1500);
  if(navigator.vibrate) navigator.vibrate([250,150,250,150,250]);
}
function stopRinging(){
  if(ringSoundTimer){ clearInterval(ringSoundTimer); ringSoundTimer=null; }
  if(navigator.vibrate) navigator.vibrate(0);
}

// ── 점원이 미리 통화 버튼을 안 눌러놨어도, 고객이 걸면 즉시 알림(+ 벨/진동) ──
let lastSeenOfferSdp = null;
db.ref(`rtc/${ROOM_ID}/offer`).on('value', snap=>{
  const offer = snap.val();
  const btn = document.getElementById('callBtn');
  if(!btn || callActive) return; // 이미 통화 중이면 관여 안 함
  if(!offer){
    if(lastSeenOfferSdp){ // 점원이 받기 전에 고객이 먼저 끊은 경우
      btn.className='';
      btn.textContent='📞 통화 대기 중';
      showMsg('📵 고객이 통화를 취소했어요');
      stopRinging();
    }
    lastSeenOfferSdp = null;
    return;
  }
  if(offer.sdp !== lastSeenOfferSdp){
    lastSeenOfferSdp = offer.sdp;
    btn.className='ringing';
    btn.textContent='🔔 고객이 통화 중! 탭해서 받기';
    showMsg('📞 고객이 통화를 요청했어요!');
    startRinging();
  }
});

async function toggleCall(){
  const btn = document.getElementById('callBtn');
  const micSt = document.getElementById('micStatus');
  stopRinging(); // 탭하는 순간 벨/진동 즉시 정지

  if(callActive){
    endCall();
    btn.textContent='📞 통화 대기 중';
    btn.className='';
    micSt.textContent='마이크 꺼짐';
    document.getElementById('vviz').classList.remove('on');
    return;
  }

  btn.className='ringing'; btn.textContent='⏳ 마이크 준비 중...';

  try{
    localStream = await navigator.mediaDevices.getUserMedia({audio:true,video:false});
  }catch(err){
    showMsg('⚠️ 마이크 권한이 필요해요');
    btn.className=''; btn.textContent='📞 통화 대기 중';
    return;
  }

  micSt.textContent='마이크 켜짐';
  await startAnswer();
}

async function startAnswer(){
  const btn = document.getElementById('callBtn');
  const config = {
    iceServers:[
      {urls:'stun:stun.l.google.com:19302'},
      {urls:'stun:stun1.l.google.com:19302'},
      {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
      {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'}
    ]
  };
  pc = new RTCPeerConnection(config);

  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

  pc.ontrack = e=>{
    document.getElementById('remoteAudio').srcObject = e.streams[0];
  };

  pc.onicecandidate = e=>{
    if(e.candidate){
      db.ref(`rtc/${ROOM_ID}/clerkCandidates`).push(e.candidate.toJSON());
    }
  };

  pc.onconnectionstatechange = ()=>{
    if(pc.connectionState==='connected'){
      callActive=true;
      stopRinging();
      btn.className='active'; btn.textContent='📵 통화 종료';
      document.getElementById('vviz').classList.add('on');
      showMsg('📞 고객과 연결됐어요!');
    }
  };

  // Offer 수신 대기
  db.ref(`rtc/${ROOM_ID}/offer`).on('value', async snap=>{
    const offer = snap.val();
    if(!offer || pc.currentRemoteDescription) return;
    await pc.setRemoteDescription(new RTCSessionDescription(offer));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await db.ref(`rtc/${ROOM_ID}/answer`).set({
      sdp: answer.sdp, type: answer.type
    });
    btn.className='ringing'; btn.textContent='🔔 고객 연결 중...';
  });

  // 고객 ICE 후보 수신
  db.ref(`rtc/${ROOM_ID}/customerCandidates`).on('child_added', async snap=>{
    const c = snap.val();
    if(c && pc) await pc.addIceCandidate(new RTCIceCandidate(c));
  });
}

function endCall(){
  if(pc){pc.close();pc=null;}
  if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null;}
  db.ref(`rtc/${ROOM_ID}`).remove();
  document.getElementById('remoteAudio').srcObject=null;
  callActive=false;
}
function ptz(cmd){db.ref('ptz').set({cmd:cmd,t:Date.now()});}

// ── 점원이 직접 "다음 고객으로 넘기기" (현재 활성 고객을 강제로 내림) ──
function forceNextCustomer(){
  db.ref('activeSession').remove();
  showMsg('🙋 다음 고객에게 넘겼어요');
}

// ── 점원 광학줌: 누르는 동안 0.3초마다 반복 전송(신호 씹힘 방지), 뗄 때 정지 신호 2회(이중 안전장치) ──
const Z_MIN_PULSE = 250;
let __zDir=null, __zStart=0, __zMinTimer=null, __zRepeatTimer=null;
function zoomDown(dir){
  if(__zMinTimer){ clearTimeout(__zMinTimer); __zMinTimer=null; }
  if(__zRepeatTimer){ clearInterval(__zRepeatTimer); __zRepeatTimer=null; }
  __zDir=dir; __zStart=Date.now();
  ptz(dir);
  __zRepeatTimer=setInterval(()=>{ if(__zDir===dir) ptz(dir); }, 300);
}
function sendStopTwice(){
  ptz('stop');
  setTimeout(()=>{ ptz('stop'); }, 100);
}
function zoomUp(){
  if(!__zDir) return;
  const elapsed=Date.now()-__zStart;
  __zDir=null;
  if(__zRepeatTimer){ clearInterval(__zRepeatTimer); __zRepeatTimer=null; }
  if(elapsed<Z_MIN_PULSE){
    __zMinTimer=setTimeout(()=>{ sendStopTwice(); __zMinTimer=null; }, Z_MIN_PULSE-elapsed);
  } else {
    sendStopTwice();
  }
}
(function(){
  const track=document.getElementById('czTrack');
  const knob=document.getElementById('czKnob');
  if(!track) return;
  let dragging=false, curDir=null;
  const maxR=55, deadzone=18;

  function setKnob(dy){ knob.style.transition='none'; knob.style.transform=`translate(-50%, calc(-50% + ${dy}px))`; }
  function resetKnob(){ knob.style.transition='transform .15s ease'; knob.style.transform='translate(-50%,-50%)'; }

  function handleMove(clientY){
    const r=track.getBoundingClientRect();
    const cy=r.top+r.height/2;
    let dy=clientY-cy;
    if(Math.abs(dy)>maxR) dy=dy>0?maxR:-maxR;
    setKnob(dy);
    let dir=null;
    if(Math.abs(dy)>deadzone) dir = dy<0 ? 'zoomin' : 'zoomout';
    if(dir!==curDir){
      if(curDir) zoomUp();
      curDir=dir;
      if(curDir) zoomDown(curDir);
    }
  }
  function endDrag(){
    dragging=false; resetKnob();
    if(curDir){ zoomUp(); curDir=null; }
  }

  track.addEventListener('pointerdown', e=>{ dragging=true; track.setPointerCapture(e.pointerId); handleMove(e.clientY); });
  track.addEventListener('pointermove', e=>{ if(!dragging) return; handleMove(e.clientY); });
  track.addEventListener('pointerup', endDrag);
  track.addEventListener('pointercancel', endDrag);
  window.addEventListener('blur', ()=>{ if(dragging) endDrag(); });
})();
function zoomResetApprox(){
  // 광학줌 절대 리셋 명령이 없어 '광각 끝까지'로 근사 이동합니다
  if(__zRepeatTimer){ clearInterval(__zRepeatTimer); __zRepeatTimer=null; }
  if(__zMinTimer){ clearTimeout(__zMinTimer); __zMinTimer=null; }
  __zDir=null;
  ptz('zoomout');
  setTimeout(()=>{ sendStopTwice(); }, 4000);
  showMsg('↩️ 최대 광각으로 되돌리는 중...');
}
function showMsg(msg){
  const el=document.getElementById('msgAlert');
  el.textContent=msg; el.style.display='block';
  setTimeout(()=>{el.style.display='none';},3500);
}

// 슬라이드형 주문 패널 (평소엔 숨김, 고객이 메뉴 선택하면 자동으로 열림)
// ═══════════════════════════════════════════
const MENU = [
  {id:1,e:'🥐',name:'크루아상',price:3200},
  {id:2,e:'🥖',name:'바게트',price:4500},
  {id:3,e:'🍞',name:'식빵',price:5500},
  {id:4,e:'🫓',name:'단팥빵',price:2500},
  {id:5,e:'🧁',name:'소보로',price:2800},
  {id:6,e:'🧇',name:'머핀',price:3500},
  {id:7,e:'🍩',name:'도넛',price:2200},
  {id:8,e:'🫙',name:'베이글',price:3800}
];
let orderItems = [];
let lastPickedId = null;

function renderOrderGrid(){
  const grid = document.getElementById('orderGrid');
  grid.innerHTML = MENU.map(m => `
    <button class="order-btn${m.id===lastPickedId?' picked':''}" onclick="addItem(${m.id})">
      <span class="ob-em">${m.e}</span>
      ${m.name}
      <span class="ob-price">₩${m.price.toLocaleString()}</span>
    </button>
  `).join('');
}

function toggleOrderPanel(force){
  const panel=document.getElementById('orderPanel');
  const open = typeof force==='boolean' ? force : !panel.classList.contains('open');
  panel.classList.toggle('open', open);
}

function addItem(id){
  const m = MENU.find(x=>x.id===id);
  if(!m) return;
  const exist = orderItems.find(x=>x.id===id);
  if(exist){ exist.qty++; }
  else { orderItems.push({...m, qty:1}); }
  lastPickedId = id;
  renderOrderGrid();
  renderPickedList();
  updateOrderDisplay();
  sendOrderToFirebase();
  showMsg(`${m.e} ${m.name} 추가!`);
}

// ── 담긴 상품 목록: 잘못 담았거나 고객이 마음이 바뀌었을 때 개별로 빼거나 더할 수 있음 ──
function renderPickedList(){
  const el=document.getElementById('pickedList');
  if(!el) return;
  if(!orderItems.length){ el.innerHTML=''; return; }
  el.innerHTML = orderItems.map(i=>`
    <div class="picked-row">
      <span class="pr-name">${i.e} ${i.name} × ${i.qty}</span>
      <div class="pr-btns">
        <button class="pr-minus" onclick="decItem(${i.id})">−</button>
        <button class="pr-plus" onclick="incItem(${i.id})">＋</button>
      </div>
    </div>
  `).join('');
}
function incItem(id){ addItem(id); }
function decItem(id){
  const idx = orderItems.findIndex(x=>x.id===id);
  if(idx<0) return;
  orderItems[idx].qty--;
  const removed = orderItems[idx].qty<=0;
  if(removed) orderItems.splice(idx,1);
  renderOrderGrid();
  renderPickedList();
  updateOrderDisplay();
  sendOrderToFirebase();
  showMsg(removed ? '🗑 상품을 뺐어요' : '➖ 수량을 줄였어요');
}

function updateOrderDisplay(){
  const total = orderItems.reduce((s,i)=>s+i.price*i.qty, 0);
  const count = orderItems.reduce((s,i)=>s+i.qty, 0);
  document.getElementById('orderTotalAmt').textContent = '₩'+total.toLocaleString();
  document.getElementById('orderItemCount').textContent = count+'개';
  const badge=document.getElementById('orderBadge');
  if(count>0){ badge.style.display='inline-block'; badge.textContent=count; }
  else { badge.style.display='none'; }
  const camBadge=document.getElementById('camOrderBadge');
  if(camBadge){
    if(count===0){ camBadge.style.display='none'; }
    else{
      const itemLines = orderItems.map(i=>`${i.e} ${i.name} × ${i.qty}`).join('<br>');
      camBadge.innerHTML = `${itemLines}<br>합계 ${count}개 · ₩${total.toLocaleString()}`;
      camBadge.style.display='block';
    }
  }
}

// ── 고객이 결제를 완료하면: 벨/알림 + 배송 정보 표시 ──
let lastPaidAt = 0;
db.ref('liveOrder').on('value', snap=>{
  const d = snap.val();
  if(!d || !d.paid || !d.paidAt || d.paidAt===lastPaidAt) return;
  lastPaidAt = d.paidAt;
  showMsg(`✅ 결제 완료! 주문번호 ${d.orderNumber}`);
  playRingBeep();
  const box = document.getElementById('paidInfo');
  if(box){
    box.style.display='block';
    box.innerHTML =
      `✅ <b>결제 완료</b> · 주문번호 ${d.orderNumber}<br>`+
      `결제수단: ${d.payMethod}<br>`+
      `상품 ₩${(d.itemTotal||0).toLocaleString()} + 배달비 ${d.deliveryFee?('₩'+d.deliveryFee.toLocaleString()):'무료'} = <b>₩${(d.grandTotal||0).toLocaleString()}</b><br>`+
      `📍 배송지: ${d.address||''}`;
  }
  toggleOrderPanel(true);
});

function sendOrderToFirebase(){
  const total = orderItems.reduce((s,i)=>s+i.price*i.qty, 0);
  const count = orderItems.reduce((s,i)=>s+i.qty, 0);
  db.ref('liveOrder').set({ items: orderItems, total: total, count: count, t: Date.now() });
}

function clearOrder(){
  orderItems = [];
  lastPickedId = null;
  renderOrderGrid();
  renderPickedList();
  updateOrderDisplay();
  const paidBox=document.getElementById('paidInfo');
  if(paidBox){ paidBox.style.display='none'; paidBox.innerHTML=''; }
  db.ref('liveOrder').set({items:[], total:0, count:0, t:Date.now()});
  showMsg('🗑 주문이 초기화됐어요');
}

function confirmOrder(){
  const total = orderItems.reduce((s,i)=>s+i.price*i.qty, 0);
  if(total === 0){ showMsg('⚠️ 상품을 먼저 추가해주세요'); return; }
  db.ref('liveOrder').update({confirmed:true, t:Date.now()});
  showMsg('✅ 결제 요청을 고객에게 전송했어요!');
}

renderOrderGrid();

// ── 고객이 메뉴에서 상품 위치로 이동(구경): 자동으로 담기지 않음, 알림만 ──

db.ref('customerPick').on('value', snap=>{
